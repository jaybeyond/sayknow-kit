name: CI

# Sanity-check that the app still builds on every push to main / PR.
# Lighter than release.yml — no artifact upload, no Release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ci-${{ matrix.target }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check + frontend build
        run: pnpm build

      - name: Version consistency
        run: |
          node -e '
          const fs = require("fs");
          // Windows runners check out CRLF; parse on normalized text or the
          // line-anchored patterns and the [[package]] split both miss.
          const read = (p) => fs.readFileSync(p, "utf8").replace(/\r\n/g, "\n");
          const pkg = JSON.parse(read("package.json")).version;
          const conf = JSON.parse(read("src-tauri/tauri.conf.json")).version;
          const toml = read("src-tauri/Cargo.toml").match(/^version = "(.+)"$/m)[1];
          const lock = read("src-tauri/Cargo.lock")
            .split("\n[[package]]\n")
            .find((b) => b.startsWith("name = \"sayknow\""))
            .match(/^version = "(.+)"$/m)[1];
          const vs = { pkg, conf, toml, lock };
          const bad = Object.entries(vs).filter(([, v]) => v !== pkg);
          if (bad.length) { console.error("version mismatch:", vs); process.exit(1); }
          console.log("versions aligned:", pkg);
          '
      - name: Rust tests (--locked)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Tauri build (no bundle)
        run: pnpm tauri build --no-bundle ${{ matrix.args }}
