name: CI

# Sanity-check that the app still builds on every push to main / PR.
# Lighter than release.yml — no artifact upload, no Release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: ${{ matrix.target }}
          # The pinned toolchain ships without clippy unless it is asked for,
          # and the lint gate below is only a gate if the linter exists.
          components: clippy

      # protoc generates the Cursor agent protocol types in build.rs; the
      # build fails with an install hint without it.
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target
          key: ci-${{ matrix.target }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Type-check + frontend build
        run: pnpm build

      - name: Version consistency
        run: |
          node -e '
          const fs = require("fs");
          // Windows runners check out CRLF; parse on normalized text or the
          // line-anchored patterns and the [[package]] split both miss.
          const read = (p) => fs.readFileSync(p, "utf8").replace(/\r\n/g, "\n");
          const pkg = JSON.parse(read("package.json")).version;
          const conf = JSON.parse(read("src-tauri/tauri.conf.json")).version;
          const toml = read("src-tauri/Cargo.toml").match(/^version = "(.+)"$/m)[1];
          const lock = read("src-tauri/Cargo.lock")
            .split("\n[[package]]\n")
            .find((b) => b.startsWith("name = \"sayknow\""))
            .match(/^version = "(.+)"$/m)[1];
          const vs = { pkg, conf, toml, lock };
          const bad = Object.entries(vs).filter(([, v]) => v !== pkg);
          if (bad.length) { console.error("version mismatch:", vs); process.exit(1); }
          console.log("versions aligned:", pkg);
          '
      # The lint that caught IOKit's matching dictionary being declared as a
      # CFString. Warnings are denied so the next one cannot pile up unseen.
      - name: Rust lint (clippy)
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      # Advisory gate on the locked graph. The ignore list and the reason for
      # every entry live in .cargo/audit.toml, which cargo-audit reads from the
      # working directory, so CI and release cannot drift apart. cargo-audit is
      # pointed at the src-tauri lockfile — the repo root has none. The pin is
      # 0.22.2 because 0.21.x cannot parse CVSS 4.0 advisories and dies on the
      # current database instead of auditing.
      - name: Rust advisory audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file src-tauri/Cargo.lock

      - name: Rust tests (--locked)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Tauri build (no bundle)
        run: pnpm tauri build --no-bundle ${{ matrix.args }}
